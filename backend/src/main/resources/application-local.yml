# Hồ sơ mặc định: MySQL cài trên máy cá nhân (XAMPP hoặc MySQL Server).
#
# Dữ liệu nằm trong MySQL nên còn nguyên sau khi tắt máy chủ, khác hồ sơ dev dùng
# H2 trên RAM. Lần chạy đầu Flyway tự tạo bảng và nạp dữ liệu mẫu, không phải chạy
# tay tệp SQL nào.
#
# Chạy bằng lệnh:
#   mvn spring-boot:run
spring:
  datasource:
    # createDatabaseIfNotExist=true: không cần CREATE DATABASE trước, chỉ cần MySQL
    # đang chạy là khởi động được. Tài khoản kết nối phải có quyền tạo cơ sở dữ liệu.
    url: ${DB_URL:jdbc:mysql://localhost:3306/vuonsen_fnb?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:root}
    # XAMPP để trống mật khẩu root. Máy nào đặt mật khẩu thì khai biến DB_PASSWORD.
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Flyway lo tạo bảng, Hibernate chỉ đối chiếu
      ddl-auto: validate
    # Bật lên thì mọi câu lệnh SQL đều in ra màn hình, lần chạy đầu sinh hàng triệu
    # dòng làm trôi mất các dòng báo lỗi. Cần xem SQL thì đổi thành true.
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  h2:
    console:
      enabled: false

logging:
  level:
    vn.vuonsen.fnb: DEBUG
