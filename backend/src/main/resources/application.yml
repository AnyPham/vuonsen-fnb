spring:
  application:
    name: fnb-backend
  profiles:
    active: dev

  config:
    # Khoa API cua tro ly AI dat o tep rieng tro-ly-ai.properties, khong nam trong git.
    # Co tep thi tro ly tu bat AI moi lan khoi dong, khong phai dat bien moi truong bang tay.
    # Hai duong dan de chay duoc ca tu thu muc backend lan tu thu muc goc du an.
    import: "optional:file:./tro-ly-ai.properties,optional:file:./backend/tro-ly-ai.properties"

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vuonsen_fnb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Flyway lo tạo bảng, Hibernate chỉ kiểm tra chứ không tự sửa
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
  servlet:
    context-path: /

# Cấu hình riêng của ứng dụng
app:
  jwt:
    # Khóa bí mật tối thiểu 32 ký tự. Khi chạy thật nhớ đổi qua biến JWT_SECRET.
    secret: ${JWT_SECRET:vuonsen-fnb-dev-secret-key-doi-lai-khi-len-production-2026}
    access-token-minutes: 60
    refresh-token-days: 14
    issuer: vuonsen-fnb

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

  # Các tham số tính giá tiệc, đổi ở đây không cần sửa code
  booking:
    guests-per-table: 10          # 1 mâm = 10 khách
    vat-rate: 0.08                # VAT 8%, kiểm tra lại thuế suất hiện hành trước khi chạy thật

    # Tiền ăn đạt mức (phí thuê x 10) thì được miễn phí thuê không gian.
    # Chưa đạt thì giảm theo tỉ lệ, tránh cảnh đông khách hơn mà trả ít tiền hơn.
    minimum-spend-multiplier: 10

    early-bird-days: 60           # đặt trước từ 60 ngày
    early-bird-rate: 0.05         # giảm thêm 5%
    deposit-rate: 0.3             # đặt cọc 30% để giữ ngày

    min-guests: 10
    max-guests: 800

    min-days-ahead: 3             # tiệc thường phải báo trước 3 ngày
    large-party-tables: 20        # từ 20 mâm trở lên coi là tiệc lớn
    large-party-min-days: 7      # tiệc lớn phải báo trước 7 ngày
    full-day-package-hours: 8     # gói từ 8 tiếng trở lên tính là thuê trọn ngày

  # Trong so cua thuat toan goi y. Tong nam trong so bang 100 cho de doc diem.
  # Tinh chinh o day roi chay lai, khong phai dich lai ma nguon.
  recommendation:
    weight-event-type: 30       # khong gian hop voi loai su kien den dau
    weight-capacity-fit: 25     # so khach lap day suc chua den dau
    weight-package-tier: 20     # tam gia goi tiec co hop voi loai tiec khong
    weight-budget: 15           # tong chi phi co nam trong ngan sach khach khai
    weight-popularity: 10       # to hop nay da duoc bao nhieu khach truoc chon

    capacity-fit-threshold: 0.6 # lap day tu 60% tro len coi la vua van
    budget-tolerance: 0.15      # vuot ngan sach duoi 15% van duoc nua diem

    top-n: 3                    # tra ve ba phuong an
    max-per-space: 1            # moi khong gian chi xuat hien mot lan

  # Quy dinh nhan don dat mon le: giao tan nha hoac dat truoc roi toi an tai cho.
  # Day la nhung con so kinh doanh hay doi nen de o day, khong viet cung trong ma.
  dish-order:
    delivery-fee: 30000           # phi giao mot don
    free-delivery-from: 500000    # don tu muc nay tro len duoc mien phi giao
    min-delivery-amount: 150000   # don giao tan nha phai dat muc toi thieu

    min-hours-ahead: 2            # muc san, mon lam lau hon thi tu doi hoi bao som hon
    max-days-ahead: 30            # khong nhan don qua xa vi nguyen lieu tuoi

    min-guests-dine-in: 1
    max-guests-dine-in: 40        # dong hon thi chuyen sang dat tiec theo goi

  # Thu di cua nha hang: email xac nhan don va email dat lai mat khau.
  #
  # Khong khai bao may chu thu thi he thong khong gui that, chi ghi noi dung thu vao bang
  # email_logs va in ra man hinh. Tai ma nguon ve la chay duoc ngay, khong bi chan o buoc
  # phai co tai khoan email.
  #
  # Muon gui that bang Gmail: bat xac thuc hai buoc cho tai khoan, tao mot "Mat khau ung dung",
  # roi dat ba bien moi truong truoc khi khoi dong:
  #   SPRING_MAIL_HOST=smtp.gmail.com
  #   SPRING_MAIL_USERNAME=<email cua nha hang>
  #   SPRING_MAIL_PASSWORD=<mat khau ung dung vua tao>
  # Khong ghi mat khau thang vao tep nay vi tep nay nam trong kho ma nguon.
  mail:
    from: ${MAIL_FROM:Vuon Sen <khong-tra-loi@vuonsen.vn>}
    base-url: ${APP_BASE_URL:http://localhost:5173}

  # Tai khoan ngan hang nhan tien, dung de dung ma VietQR cho khach quet.
  #
  # De trong so tai khoan thi website van nhan don binh thuong nhung khong hien ma QR, chi
  # nhac khach lien he nha hang. Khong ghi san mot so tai khoan gia vao day, vi so gia van
  # co the la tai khoan that cua nguoi khac.
  payment:
    bank-bin: ${PAYMENT_BANK_BIN:970422}            # 970422 la MB Bank, 970415 la VietinBank
    account-number: ${PAYMENT_ACCOUNT_NUMBER:}      # dien so tai khoan that cua nha hang vao day
    account-name: ${PAYMENT_ACCOUNT_NAME:VUON SEN}
    bank-name: ${PAYMENT_BANK_NAME:MB Bank}

    # Che do chay thu.
    #
    # Bat thi he thong dung so tai khoan toan so 0 de van dung duoc ma QR va di het luong,
    # dong thoi mo them mot duong dan gia lap ngan hang bao co de xac nhan phieu thu ma
    # khong can chuyen tien that. Giao dien hien canh bao ro dang o che do thu.
    #
    # PHAI tat khi chay that: dat PAYMENT_SANDBOX=false va dien so tai khoan that o tren.
    sandbox: ${PAYMENT_SANDBOX:true}

  # Cong thanh toan VNPay.
  #
  # Khac VietQR o cho: VietQR chi la ma chuyen khoan, nhan vien phai tu doi soat; VNPay la
  # cong that, khach tra xong thi cong goi nguoc ve bao ket qua nen he thong biet ngay.
  #
  # De trong tmn-code thi coi nhu chua mo cong: website van chay va van thanh toan duoc bang
  # ma VietQR, chi khong hien lua chon tra qua VNPay.
  #
  # Lay ma thu nghiem mien phi tai sandbox.vnpayment.vn, roi dat hai bien moi truong
  # VNPAY_TMN_CODE va VNPAY_HASH_SECRET. Khong ghi thang vao tep nay.
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/thanh-toan/ket-qua}
    expire-minutes: 15

  # Thong tin lien he, tro ly AI dung de tra loi khach.
  # Phai viet co dau vi tro ly doc thang cac gia tri nay roi doc lai cho khach.
  contact:
    address: "1147 Bình Quới, Phường 28, Bình Thạnh, TP.HCM"
    phone: "(028) 1234 5678"
    email: datban@vuonsen.vn
    opening-hours: "9:00 - 22:00 hằng ngày"

  # Tro ly tu van. Mac dinh chay bang co che du phong trong he thong: khong can
  # khoa API, khong ton phi, tai ve la chay duoc ngay.
  #
  # Bat nhanh goi Claude: chep backend/tro-ly-ai.properties.example thanh
  # backend/tro-ly-ai.properties, dan khoa vao do mot lan; tu lan sau khoi dong la AI tu bat.
  # Cung nhan khoa tu bien moi truong ASSISTANT_LLM_API_KEY hoac ANTHROPIC_API_KEY.
  # Tuyet doi khong ghi khoa vao day vi tep nay nam trong git.
  #
  # Goi hong, het han cho hay sai khoa deu tu dong quay ve co che du phong,
  # khach khong thay loi.
  assistant:
    llm:
      enabled: ${ASSISTANT_LLM_ENABLED:true}
      api-key: ${ASSISTANT_LLM_API_KEY:${ANTHROPIC_API_KEY:}}
      # Doi duoc sang dich vu khac cung chuan, hoac tro vao may gia de thu nghiem
      base-url: ${ASSISTANT_LLM_BASE_URL:https://api.anthropic.com}
      # Mac dinh Claude Opus 5. Dat ASSISTANT_LLM_MODEL=claude-sonnet-5 neu muon re hon.
      model: ${ASSISTANT_LLM_MODEL:claude-opus-5}
      # Muc cong suc suy luan: low du cho cau tu van ngan, tra loi nhanh va it ton token
      effort: ${ASSISTANT_LLM_EFFORT:low}
      # Tran do dai cau tra loi, gom ca phan suy luan; de rong de khong bi cat giua chung
      max-tokens: 4000
      timeout-seconds: 20   # qua han thi tra loi bang co che du phong, khach khong phai doi mai

  admin:
    # Tài khoản admin tạo tự động khi chạy lần đầu
    default-email: ${ADMIN_EMAIL:admin@vuonsen.vn}
    default-password: ${ADMIN_PASSWORD:Admin@123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    vn.vuonsen.fnb: DEBUG
