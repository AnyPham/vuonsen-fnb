# Cấu hình khi học và chạy thử: dùng H2 chạy trên RAM, không cần cài MySQL.
# Xem dữ liệu tại http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:vuonsen)
spring:
  datasource:
    url: jdbc:h2:mem:vuonsen;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      # validate: entity lệch với bảng thì báo lỗi ngay lúc khởi động
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
